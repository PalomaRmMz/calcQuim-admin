$kind: http-request
name: 07 Art?culo comprado
url: "{{baseUrl}}/api/v1/purchased-items"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"name": "Concentrado Postman {{runTag}}", "unit": "litro", "sourcingType": "CONCENTRATE", "active": true}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => { if (pm.response.code !== 200) throw new Error('Estado inesperado'); });
      const value = pm.response.json();
      if (Number.isInteger(value.revision)) pm.collectionVariables.set('revision', String(value.revision));
      if (value.generation) pm.collectionVariables.set('generation', value.generation);
      pm.collectionVariables.set('articleId', String(value.data.procurement.purchasedItems[value.data.procurement.purchasedItems.length - 1].id));
    language: text/javascript
order: 8000
