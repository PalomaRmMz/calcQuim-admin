$kind: http-request
url: "{{baseUrl}}/api/v1/suppliers"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"name": "Proveedor B {{runTag}}", "active": true}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => { if (pm.response.code !== 200) throw new Error('Estado inesperado'); });
      const value = pm.response.json();
      if (Number.isInteger(value.revision)) pm.collectionVariables.set('revision', String(value.revision));
      if (value.generation) pm.collectionVariables.set('generation', value.generation);
      pm.collectionVariables.set('supplierB', String(value.data.procurement.suppliers[value.data.procurement.suppliers.length - 1].id));
    language: text/javascript
order: 7000
