$kind: http-request
name: 12 Compra sint?tica
url: "{{baseUrl}}/api/v1/purchases"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"supplierId": "{{supplierA}}", "date": "2026-01-02", "items": [{"supplyItemId": "{{sourceA}}", "quantity": 2, "costMode": "unit", "cost": 30}]}'
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('purchaseKey', pm.request.headers.get('Idempotency-Key'));
      pm.collectionVariables.set('purchaseBody', pm.variables.replaceIn(pm.request.body.raw));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => { if (pm.response.code !== 200) throw new Error('Estado inesperado'); });
      const value = pm.response.json();
      if (Number.isInteger(value.revision)) pm.collectionVariables.set('revision', String(value.revision));
      if (value.generation) pm.collectionVariables.set('generation', value.generation);
      pm.collectionVariables.set('purchaseId', String(value.data.procurement.purchases[0].id));
      pm.collectionVariables.set('purchaseItemId', String(value.data.procurement.purchases[0].items[0].id));
    language: text/javascript
order: 15000
