$kind: http-request
url: "{{baseUrl}}/api/v1/price-groups"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"name": "Grupo Postman {{runTag}}", "price": 20, "active": true}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => { if (pm.response.code !== 200) throw new Error('Estado inesperado'); });
      const value = pm.response.json();
      if (Number.isInteger(value.revision)) pm.collectionVariables.set('revision', String(value.revision));
      if (value.generation) pm.collectionVariables.set('generation', value.generation);
      pm.collectionVariables.set('priceGroupId', String(value.data.priceGroups[value.data.priceGroups.length - 1].id));
    language: text/javascript
order: 4000
