$kind: http-request
name: 09 Conversi?n
url: "{{baseUrl}}/api/v1/supply-conversions"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"purchasedItemId": "{{articleId}}", "outputProductId": {{productId}}, "active": true, "yield": {"inputQuantity": 1, "inputUnit": "litro", "outputQuantity": 5, "outputUnit": "litro"}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => { if (pm.response.code !== 200) throw new Error('Estado inesperado'); });
      const value = pm.response.json();
      if (Number.isInteger(value.revision)) pm.collectionVariables.set('revision', String(value.revision));
      if (value.generation) pm.collectionVariables.set('generation', value.generation);
      pm.collectionVariables.set('conversionId', String(value.data.procurement.supplyConversions[value.data.procurement.supplyConversions.length - 1].id));
    language: text/javascript
order: 11000
