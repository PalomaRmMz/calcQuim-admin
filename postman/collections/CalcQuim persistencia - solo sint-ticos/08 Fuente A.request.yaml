$kind: http-request
url: "{{baseUrl}}/api/v1/supply-sources"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"purchasedItemId": "{{articleId}}", "supplierId": "{{supplierA}}", "purchaseUnit": "litro", "purchaseQuantity": 1, "presentation": "Sint?tica", "active": true}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => { if (pm.response.code !== 200) throw new Error('Estado inesperado'); });
      const value = pm.response.json();
      if (Number.isInteger(value.revision)) pm.collectionVariables.set('revision', String(value.revision));
      if (value.generation) pm.collectionVariables.set('generation', value.generation);
      pm.collectionVariables.set('sourceA', String(value.data.procurement.supplyItems[value.data.procurement.supplyItems.length - 1].id));
    language: text/javascript
order: 9000
